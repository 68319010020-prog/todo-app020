<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Todo App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #1a1a2e;
    }

    .add-form {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.5rem;
    }

    .add-form input {
      flex: 1;
      padding: .6rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .add-form button {
      padding: .6rem 1.2rem;
      background: #2E75B6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: .2s;
    }

    .add-form button:hover {
      background: #1a5a99;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem;
      border-bottom: 1px solid #eee;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-title {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
    }

    .todo-title.done {
      text-decoration: line-through;
      color: #999;
    }

    .edit-btn {
      background: #f39c12;
      color: white;
      border: none;
      border-radius: 6px;
      padding: .35rem .75rem;
      cursor: pointer;
      font-size: .85rem;
      transition: .2s;
    }

    .edit-btn:hover {
      background: #d68910;
    }

    .delete-btn {
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 6px;
      padding: .35rem .75rem;
      cursor: pointer;
      font-size: .85rem;
      transition: .2s;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📋 DevOps Todo List</h1>

    <div class="add-form">
      <input 
        type="text" 
        id="new-todo" 
        placeholder="พิมพ์งานใหม่แล้วกด Enter"
      />

      <button onclick="addTodo()">
        เพิ่ม
      </button>
    </div>

    <div id="todo-list">
      กำลังโหลด...
    </div>
  </div>

  <script>
    const API = 'http://localhost:3001/api';

    // โหลดข้อมูลทั้งหมด
    async function fetchTodos() {
      try {
        const res = await fetch(`${API}/todos`);
        const todos = await res.json();

        renderTodos(todos);

      } catch (error) {
        document.getElementById('todo-list').innerHTML =
          '<p class="empty">โหลดข้อมูลไม่สำเร็จ</p>';

        console.error(error);
      }
    }

    // แสดงรายการ
    function renderTodos(todos) {
      const list = document.getElementById('todo-list');

      if (todos.length === 0) {
        list.innerHTML = `
          <p class="empty">
            ยังไม่มีงาน
          </p>
        `;
        return;
      }

      list.innerHTML = todos.map(todo => `
        <div class="todo-item">

          <input
            type="checkbox"
            ${todo.completed ? 'checked' : ''}
            onchange="toggleTodo(${todo.id})"
          />

          <span class="todo-title ${todo.completed ? 'done' : ''}">
            ${todo.title}
          </span>

          <button
            class="edit-btn"
            onclick="editTodo(${todo.id}, '${todo.title.replace(/'/g, "\\'")}')"
          >
            แก้ไข
          </button>

          <button
            class="delete-btn"
            onclick="deleteTodo(${todo.id})"
          >
            ลบ
          </button>

        </div>
      `).join('');
    }

    // เพิ่มงาน
    async function addTodo() {
      const input = document.getElementById('new-todo');

      const title = input.value.trim();

      if (!title) {
        alert('กรุณากรอกงาน');
        return;
      }

      try {
        await fetch(`${API}/todos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title
          })
        });

        input.value = '';

        fetchTodos();

      } catch (error) {
        alert('เพิ่มงานไม่สำเร็จ');
        console.error(error);
      }
    }

    // เปลี่ยนสถานะ
    async function toggleTodo(id) {
      try {
        await fetch(`${API}/todos/${id}`, {
          method: 'PATCH'
        });

        fetchTodos();

      } catch (error) {
        alert('อัปเดตสถานะไม่สำเร็จ');
        console.error(error);
      }
    }

    // แก้ไขงาน
    async function editTodo(id, oldTitle) {
      const newTitle = prompt('แก้ไขงาน', oldTitle);

      if (!newTitle) return;

      if (newTitle.trim() === '') {
        alert('ห้ามเว้นว่าง');
        return;
      }

      try {
        await fetch(`${API}/todos/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title: newTitle.trim()
          })
        });

        fetchTodos();

      } catch (error) {
        alert('แก้ไขงานไม่สำเร็จ');
        console.error(error);
      }
    }

    // ลบงาน
    async function deleteTodo(id) {
      const confirmDelete = confirm('ลบงานนี้?');

      if (!confirmDelete) return;

      try {
        await fetch(`${API}/todos/${id}`, {
          method: 'DELETE'
        });

        fetchTodos();

      } catch (error) {
        alert('ลบงานไม่สำเร็จ');
        console.error(error);
      }
    }

    // กด Enter เพื่อเพิ่มงาน
    document
      .getElementById('new-todo')
      .addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          addTodo();
        }
      });

    // เริ่มโหลดข้อมูล
    fetchTodos();
  </script>

</body>
</html>
